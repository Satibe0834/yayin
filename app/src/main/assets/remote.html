.plogo{display:inline-flex;align-items:center;gap:.14em;font-family:'PersetLogo',system-ui,sans-serif;font-weight:700;font-size:22px;letter-spacing:-.015em;line-height:1;color:#fff}
.plogo b{color:#D00D33;font-weight:700}
.globe{flex:none;margin:-6px -2px -6px -4px}
.dot{width:9px;height:9px;border-radius:50%;background:#666;margin-left:auto}
.dot.on{background:#2ecc71;box-shadow:0 0 0 4px rgba(46,204,113,.2)}
.now{margin:0 12px 8px;background:var(--p1);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center}
.now .lg{width:44px;height:44px;border-radius:10px;background:var(--p2);display:grid;place-items:center;overflow:hidden;font-weight:800;color:var(--mu)}
.now .lg img{width:100%;height:100%;object-fit:contain}
.now .t{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .s{font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ts{grid-column:1/-1;display:none;gap:8px;align-items:center;margin-top:4px}
.ts.on{display:flex}
.ts .bar{flex:1;height:6px;background:var(--line);border-radius:3px;position:relative;overflow:hidden}
.ts .bar i{position:absolute;top:0;bottom:0;left:0;background:var(--acc)}
.ts .lbl{font-size:12px;font-weight:700;color:var(--mu);min-width:62px;text-align:right}
.ts button{background:var(--p2);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:700}
.ts button.live{background:var(--acc);color:#fff}
main{flex:1;overflow-y:auto;padding:4px 12px 90px}
.tab{display:none}.tab.on{display:block}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(20,10,13,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0);backdrop-filter:blur(10px)}
nav button{background:none;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--mu);font-weight:600}
nav button span{font-size:21px}
nav button.on{color:var(--tx)}
nav button.on span{transform:scale(1.12)}
/* Kumanda */
.pad{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:14px auto 18px;border-radius:50%;background:radial-gradient(circle at 50% 40%,var(--p2),var(--p1));border:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.45)}
.pad button{position:absolute;background:none;width:33%;height:33%;font-size:26px;color:var(--tx);border-radius:50%}
.pad button:active{background:rgba(255,255,255,.08)}
.pad .u{top:2%;left:33.5%}.pad .d{bottom:2%;left:33.5%}.pad .l{left:2%;top:33.5%}.pad .r{right:2%;top:33.5%}
.pad .ok{left:33.5%;top:33.5%;background:var(--acc)!important;color:#fff;font-weight:800;font-size:19px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.row{display:grid;gap:10px;margin-bottom:10px}
.r3{grid-template-columns:repeat(3,1fr)}.r4{grid-template-columns:repeat(4,1fr)}.r2{grid-template-columns:1fr 1fr}
.k{background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:13px 6px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:3px}
.k span{font-size:20px}
.k i,nav i{font-style:normal}
.k:active{background:var(--p2);transform:scale(.97)}
.k.acc{background:var(--acc);border-color:var(--acc);color:#fff}
/* Listeler */
.ctl{display:flex;gap:8px;margin:6px 0 10px;position:sticky;top:0;background:var(--ink);padding:6px 0;z-index:2}
select,input{flex:1;min-width:0;background:var(--p1);border:1px solid var(--line);border-radius:12px;color:var(--tx);padding:11px 12px;font-size:15px}
.it{display:grid;grid-template-columns:30px 44px 1fr auto;gap:10px;align-items:center;padding:9px 8px;border-radius:12px;border:1px solid transparent}
.it+.it{border-top-color:var(--line);border-radius:0}
.it:active{background:var(--p2)}
.it .n{font-size:12px;color:var(--mu);font-weight:700;text-align:right}
.it .lg{width:44px;height:44px;border-radius:9px;background:var(--p2);display:grid;place-items:center;overflow:hidden;font-size:12px;font-weight:800;color:var(--mu)}
.it .lg img{width:100%;height:100%;object-fit:contain}
.it .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.2}
.it .sb{font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .go{background:var(--acc);color:#fff;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-size:13px}
.sec{font-weight:800;font-size:16px;margin:16px 4px 6px}
.more{width:100%;background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;font-weight:700}
.hint{color:var(--mu);text-align:center;padding:30px 10px}
.m{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:11px 6px;border-top:1px solid var(--line)}
.m .tm{font-weight:800;font-size:16px}.m .tm small{display:block;font-size:11px;color:var(--mu);font-weight:600}
.m .lv{color:#ff4d55;font-size:11px;font-weight:800}
.m .ti{font-weight:700}.m .su{font-size:12px;color:var(--mu)}
.m button{background:var(--p2);border-radius:10px;padding:8px 10px;font-weight:700;font-size:13px}
.m button.w{background:var(--acc);color:#fff}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#000c;border:1px solid var(--line);padding:9px 16px;border-radius:999px;font-weight:600;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:4px;margin:6px 0 8px}
.seg button{background:none;border-radius:9px;padding:9px 4px;font-weight:700;font-size:13px;color:var(--mu)}
.seg button.on{background:var(--acc);color:#fff}
.er{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:8px 4px;border-top:1px solid var(--line)}
.er .lg{width:40px;height:40px;border-radius:9px;background:var(--p2);display:grid;place-items:center;overflow:hidden;font-size:11px;font-weight:800;color:var(--mu)}
.er .lg img{width:100%;height:100%;object-fit:contain}
.er .nm{font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.er .og{font-size:11.5px;color:var(--mu)}
.er.hid .nm{opacity:.5;text-decoration:line-through}
.ea{display:flex;gap:6px}
.ea button{background:var(--p2);border-radius:10px;min-width:38px;height:38px;font-size:16px;font-weight:700;padding:0 8px}
.ea button.on{background:var(--acc);color:#fff}
.err{margin:30px 16px;padding:18px;border-radius:14px;background:var(--p1);border:1px solid var(--line);text-align:center;color:var(--mu)}
</style>

    $('mlist').innerHTML = `<p class="hint">${t('scanning')}</p>`;
    const r = await api('matches', { cc }); if (!r) return;
    if (r.error === 'xt'){ $('mlist').innerHTML = `<p class="hint">${t('xt')}</p>`; return; }
    $('mcc').innerHTML = (r.countries || []).map(c => `<option value="${esc(c.cc)}" ${c.cc === r.cc ? 'selected' : ''}>${esc(c.flag)} ${esc(c.name)}</option>`).join('');
    if (r.loading){ setTimeout(() => loadMatches(r.cc), 2500); return; }
    const now = Date.now() / 1000;
    $('mlist').innerHTML = (r.items || []).map(m => { const live = m.start <= now; return `<div class="m"><div class="tm">${live ? `<span class="lv">${t('live')}</span>` : hm(m.start)}<small>${live ? '' : (m.start - now > 86400 - new Date().getHours() * 3600 ? t('tomorrow') : t('today'))}</small></div><div style="min-width:0"><div class="ti">${esc(m.name)}</div><div class="su">${esc([m.league, m.chan].filter(Boolean).join(' · '))}</div></div>${live ? `<button class="w" data-mk="${esc(m.key)}" data-a="watch">${t('watch')}</button>` : `<button data-mk="${esc(m.key)}" data-a="remind">${m.reminded ? t('reminded') : t('remind')}</button>`}</div>`; }).join('') || `<p class="hint">${t('noMatch')}</p>`;
  }
  $('mcc').addEventListener('change', () => loadMatches($('mcc').value));
  $('mlist').addEventListener('click', async e => { const b = e.target.closest('[data-mk]'); if (!b) return; buzz(); const r = await api('match', { key:b.dataset.mk, act:b.dataset.a });
    if (r && r.ok){ if (b.dataset.a === 'watch'){ toast(t('openedTv')); setTimeout(poll, 600); } else b.textContent = r.reminded ? t('reminded') : t('remind'); } });
})();
</script>
</body>
</html>
