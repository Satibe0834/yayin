name: APK oluştur

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Kalıcı imza anahtarı: yalnızca ilk seferde oluşturulup depoya kaydedilir.
      # Böylece her yeni sürüm eskisinin üzerine (silmeden) kurulabilir.
      - name: İmza anahtarı
        run: |
          if [ ! -f app/release.keystore ]; then
            keytool -genkeypair -v -keystore app/release.keystore -alias yayin -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass yayin-imza -keypass yayin-imza -dname "CN=Yayin, O=Yayin, C=TR"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add app/release.keystore
            git commit -m "Kalıcı imza anahtarı [skip ci]"
            git push
          fi

      - name: APK derle
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk yayin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: yayin-apk
          path: yayin.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Yayın 1.${{ github.run_number }}
          files: yayin.apk
          make_latest: true
